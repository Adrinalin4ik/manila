[package]
name = "benilla-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Bevy app as a library: everything but the build-id stamp, which lives in the `benilla` launcher so a new commit does not rebuild this crate"

[lints]
workspace = true

[features]
# `dev` compiles in the instruments: the debug panel, perf HUD, inspector, capture harness and
# probes. Nothing may depend on it; `scripts/gates.sh` builds `benilla` with no default features.
default = ["dev"]
# `benilla-assets`, `-formats` and `-world` come in without default features and their `dev` is
# forwarded here: it is on by default in each, so unification would put it back in a player build.
dev = ["benilla-assets/dev", "benilla-formats/dev", "benilla-world/dev", "dep:bevy_egui"]
tracy = ["bevy/trace_tracy"]
# `--features trace_chrome` writes every system's per-run span to `trace-<ts>.json` in the cwd.
trace_chrome = ["bevy/trace_chrome"]
# Browser render backend, forwarded from `wenilla` (see benilla-world's note on why the world
# needs WebGPU).
webgl2 = ["bevy/webgl2", "benilla-world/webgl2"]
webgpu = ["bevy/webgpu", "benilla-world/webgpu"]

[dependencies]
# Wall-clock reads (`SystemTime::now`) go through `web-time`: a re-export of std's on native, and
# `Date.now()` in a browser, where std's panics on first use.
web-time = "1"
anyhow.workspace = true
benilla-ui = { path = "../benilla-ui" }
bevy.workspace = true
wgpu.workspace = true
bevy_egui = { version = "0.39", optional = true }
bytemuck = { version = "1", features = ["derive"] }
# `f16` decode for the `WOW_BOOTH_DUMP` dump of the `Rgba16Float` booth render targets.
half = "2"
# Compiles `assets/ui` into the binary, so the interface loads on a machine without the source.
include_dir = "0.7"
# The 1.12 chat filters (`text_filter`): the DBCs' 2289 profanity and 28 spam patterns, with one
# `RegexSet` for the any-match pass over every chat line.
regex = "1"
# `getrusage` for the perf probes' process CPU time; `mach_absolute_time` and `thread_policy_set`
# for the audio output's meter clock and its render thread's realtime policy.
libc = "0.2"
# PNG encoding only: the macOS hardware cursor's NSImage data and screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# Thread-to-ECS channels such as the net bridge's: crossbeam's `Receiver` is `Sync`, so either end
# can be a Bevy resource without a mutex.
crossbeam-channel = "0.5"
# The two channels the sequencer *waits* at (credentials, character pick). crossbeam's `recv` parks
# the calling thread, which the browser build has none of — `async_channel`'s awaits instead, and the
# ECS side keeps `try_send`ing into an unbounded queue exactly as before. `futures-lite` drives the
# sequencer future to completion on the native net thread, so that thread's behaviour is unchanged.
async-channel = "2.5"
futures-lite = "2.6.1"
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-protocol = { path = "../benilla-protocol" }
benilla-world = { path = "../benilla-world", default-features = false }
# The CVar diff persisted in `benilla-config/config.toml`.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Collision for our kinematic character controller; 0.6 targets Bevy 0.18, 0.7 moves to 0.19.
avian3d = "0.6"
# Shapes and rasterizes `FontString` text standalone (`ui_text`), at bevy_text's own 0.16.
cosmic-text = "0.16"
# `cosmic-text`'s font database, whose types `ui_text` names; must stay the version it depends on.
fontdb = "0.23"
# The mixer. Its `cpal` backend stays off on every target: `sound::output` is our own backend.
kira = { version = "0.12", default-features = false, features = ["mp3", "wav", "pcm", "adpcm"] }
# Aborts a debug build on an allocation in the audio IO callback or render pass; off in release.
assert_no_alloc = "1.1"
# For `MediaSource`: kira's decode thread reads through our source, which raises the thread's QoS
# so the world-entry burst cannot starve it. Must stay kira's version, or the trait won't match.
symphonia = { version = "0.5", default-features = false }
# The audio threads' lock-free SPSC rings (output, mix tap); kira's version, so the graph has one.
rtrb = "0.3"
mint = "0.5"
# The gossip greeting's weighted draw, re-rolled per open as in the reference; `benilla-srp`'s 0.8.
rand = "0.8"

# OS clipboard access for the UI EditBox copy/cut/paste chords (chat input). Already in the tree via
# bevy_egui; pinned to the same 3.x so there's one copy. Read on the main thread (the UI key feed is
# a NonSend system) — required for the macOS NSPasteboard path. Covers macOS, Windows, and Linux/BSD
# under X11; the Wayland backend is `smithay-clipboard` below (decision 0702). Native-only: arboard
# has no wasm32 backend at all (`textinput/clipboard.rs` falls back to no pasteboard there).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3"

[dev-dependencies]
# tests/boot_manifest.rs parses web/boot-manifest.json (the boot-prefetch read-set). Dev-only:
# the 0978 decision to keep serde_json out of the shipped app stands.
serde_json = "1"

# The WMO portal-cull audit's raw-face instruments (`WOW_PIN_COL`): the pin probe compares the
# filtered walking-collision set against the group file's FULL face list with per-face MOPY flags,
# which only the raw parser exposes — benilla-formats' gathers are exactly the filtered views.
benilla-wmo = { path = "../benilla-wmo" }

# Linux/BSD: the Wayland clipboard (decision 0702). We build with bevy's `wayland` feature, so on a
# Wayland session winit gives us a native Wayland window and `arboard` — X11-only without its
# non-default `wayland-data-control` feature — finds no X11 CLIPBOARD owner and every paste fails.
# smithay-clipboard is the right crate for a windowed app: it drives the *standard* `wl_data_device`
# off our own `wl_display`/seat, which every compositor supports. arboard's own Wayland feature would
# not do: it speaks `wlr-data-control`, a privileged manager protocol GNOME/Mutter deliberately
# doesn't implement. `raw-window-handle` (pinned to the 0.6 already in the tree via bevy_window, so
# this adds no crate) is only needed to read the `wl_display` out of bevy's `RawHandleWrapper`.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
raw-window-handle = "0.6"
smithay-clipboard = "0.7"

# macOS: AppKit through objc2 drives a native NSCursor with the window's cursor rects disabled;
# winit's cursor rects revert to the arrow under our continuous render loop (`cursor.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
# The audio device layer (`sound::output::coreaudio`): the HAL output unit through coreaudio-rs,
# the AudioObject property API through objc2-core-audio, at the versions and features cpal uses.
coreaudio-rs = { version = "0.13", default-features = false, features = ["audio_unit", "core_audio"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    # NSApplicationActivationPolicy (bgwin's Accessory demotion) is declared in this header.
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSImage",
    "NSCursor",
    "NSEvent",
] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSGeometry"] }

# The web build has no threads: the net sequencer is one `spawn_local` task on the browser's event
# loop, and the write half is pumped by a Bevy system instead of a sibling thread. `crate::webenv`
# (the wasm32 half — reading the page's own query string) and `boot.rs`'s canvas binding use the
# `web-sys` window/location. wasm-bindgen is pinned exact per the plan: a newer wasm-bindgen crate
# + the 0.2.122 CLI emits broken glue — verified, so this must track the CLI
# `scripts/web-build.sh` invokes to the digit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The browser is the one target the owned device layer below cannot reach: no threads for 1857's
# realtime render loop, and no clock for its meters (`std::time::Instant` panics here). So wasm32
# is cut out of that section and stays on kira's own cpal backend — Web Audio, via the
# `wasm-bindgen` feature kira already selects for cpal on this target. `MixBackend` in
# `sound::mixer` is the seam. Features are additive across target sections, so this only adds
# `cpal` to the kira declared above; `CpalBackendSettings`' fields ARE cpal types, so cpal must
# stay the exact version kira resolves — one cpal in the graph.
#
# **`audioworklet` is NOT enabled, and cannot be from here.** cpal's default host on this target
# is `WebAudioHost`, which renders ahead into `AudioBuffer`s and schedules them on the MAIN
# thread: a frame that overruns misses the moment to queue the next block and the sound tears.
# That is this client's crackle, and at 40-70 ms frames it overruns constantly. cpal does ship
# the fix - an `audioworklet` host that runs the same callback on the browser's own realtime
# audio thread - but it is gated on `target_feature = "atomics"`
# (cpal-0.17.1/src/host/mod.rs:12-17), so it exists only in a build with wasm threads.
#
# So the crackle and the threads are one task, not two. That is why keldurn's compute worker
# sequences audio init before rayon: with both on, the rayon bootstrap's `Atomics.wait` is
# forbidden inside `AudioWorkletGlobalScope` and the two races.
cpal = "0.17"
kira = { version = "0.12", features = ["cpal"] }
# `Response`/`fetch` and the audio-decode surfaces are `sound::web_load`'s: the zone soundscape
# fetches over `fetch` and decodes through `OfflineAudioContext::decodeAudioData`, both off the
# main thread, because doing either on it froze the frame at every zone line and doorway.
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "RequestInit",
    "Window",
    "Location",
    "Storage",
    "Response",
    "AudioBuffer",
    "BaseAudioContext",
    "OfflineAudioContext",
] }

# Everywhere else: the same device layer over cpal (decision 1920, `sound::output::cpal`). 1857
# owns the mix-ahead ring, the render thread and the meters on every platform; only the last
# hop — find the default device, open a stream on it, hand back one buffer per cycle — is
# platform code, and off macOS that hop is ALSA/PipeWire, WASAPI or the host's own API. cpal is
# the layer that already speaks all of them; on macOS it is still not in the graph, because
# there its defects (a no-op error callback on the default device, a pinned `DefaultOutput`
# unit, the discarded IO-cycle timestamp) are exactly what 1857 went direct to escape. On an
# unsupported target cpal compiles to its Null host, which reports no device — the same silent
# posture `stub.rs` has, which is why that file now survives for wasm32 alone (below).
# wasm32 is excluded: see the browser note in the wasm32 section above.
[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
cpal = "0.17"

# Windows CPU clocks for `perf::clock`: `GetProcessTimes`, `GetThreadTimes`, `GetSystemTimes`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
