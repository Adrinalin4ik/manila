[package]
name = "benilla-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 asset-format adapters (MPQ/BLP/DBC/ADT/WDT) and the benilla-extract CLI"

[lints]
workspace = true

[features]
# `dev` gates one thing, `install::candidates`' project-folder probe, which bakes this source
# tree's path into the binary. Every dependent takes this crate without default features and
# forwards `dev`, or unification puts the path back into a player build.
default = ["dev"]
dev = []

[dependencies]
# `BodyPlan` crosses a worker boundary as JSON (`characters::sections`), so the shape needs
# derives. serde is already in this graph via serde_json; this only makes the use direct.
serde = { version = "1", features = ["derive"] }
anyhow.workspace = true
clap.workspace = true
benilla-adt = { path = "../benilla-adt" }
benilla-bytes = { path = "../benilla-bytes" }
benilla-dbc = { path = "../benilla-dbc" }
benilla-m2 = { path = "../benilla-m2" }
benilla-mpq = { path = "../benilla-mpq" }
benilla-blp = { path = "../benilla-blp" }
# PNG only: the default `avif` feature would pull in rav1e, a whole AV1 encoder, to write PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
benilla-wdt = { path = "../benilla-wdt" }
benilla-wmo = { path = "../benilla-wmo" }

[dev-dependencies]
glam = "0.31"

# `Chain` fetches over HTTP instead of reading MPQ archives on the web target (no filesystem there)
# — see `src/web.rs`. Pinned exact per the wasm plan's global constraint: a newer wasm-bindgen crate
# than the installed 0.2.122 CLI emits glue the CLI can't match.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
web-sys = { version = "0.3.99", features = [
    "Window",
    "Location",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
    # `web.rs::log_index_misses` calls it. Declared here rather than relied on: this crate
    # compiled only because another member of the app's graph happened to enable it, and a
    # second consumer (`manila-skin`, the worker) does not pull that member.
    "console",
] }
serde_json = "1"
# The boot-read trace (web.rs::trace) reads window.__wenilla_boottrace as a js_sys::Array.
js-sys = "0.3"
