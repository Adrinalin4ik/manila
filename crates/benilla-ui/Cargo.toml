[package]
name = "benilla-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-free WoW UI engine core: TOC and FrameXML parsing, templates, anchors, z-order"

[lints]
workspace = true

[dependencies]
roxmltree = "0.20"
# The script host's Lua 5.1; `vendored` builds it from the workspace's patched `lua-src`.
mlua = { version = "0.11", features = ["lua51", "vendored"] }
# Experimental: `benilla-vm` runs the scripts on benilla's own 1.12 interpreter, through a crate
# that answers to the name `mlua` (`src/lib.rs`).
benilla-mlua = { path = "../benilla-mlua", optional = true }

[features]
benilla-vm = ["dep:benilla-mlua"]
